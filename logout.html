<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logout | Smile Care</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#00bcd4,#0288d1);

}

.box{

width:400px;
background:white;
padding:35px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 20px rgba(0,0,0,.2);
animation:fade 1s;

}

.box h2{

color:#0097a7;
margin-bottom:15px;

}

.box p{

color:#555;
margin-bottom:25px;

}

button{

padding:12px 25px;
margin:10px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
transition:.3s;

}

.logout{

background:#e53935;
color:white;

}

.logout:hover{

background:#c62828;
transform:scale(1.05);

}

.cancel{

background:#0097a7;
color:white;

}

.cancel:hover{

background:#006064;
transform:scale(1.05);

}

@keyframes fade{

from{

opacity:0;
transform:translateY(-30px);

}

to{

opacity:1;
transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="box">

<h2>🚪 Logout</h2>

<p>Are you sure you want to logout from your account?</p>

<button class="logout" onclick="logout()">

Yes, Logout

</button>

<button class="cancel" onclick="cancelLogout()">

Cancel

</button>

</div>

<script>

function logout(){

alert("You have logged out successfully!");

window.location.href="login.html";

}

function cancelLogout(){

window.location.href="patient_dashboard.html";

}

</script>

</body>
</html>
