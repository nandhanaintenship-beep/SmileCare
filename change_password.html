<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password | Smile Care</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#00bcd4,#0288d1);
overflow:hidden;

}

/* Floating Circles */

.circle{

position:absolute;
border-radius:50%;
background:rgba(255,255,255,.2);
animation:float 6s infinite;

}

.circle1{

width:150px;
height:150px;
top:40px;
left:60px;

}

.circle2{

width:90px;
height:90px;
bottom:60px;
right:120px;

}

.circle3{

width:70px;
height:70px;
top:280px;
right:250px;

}

/* Password Box */

.box{

width:420px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(10px);
padding:35px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
text-align:center;
animation:fade 1s;

}

.box h2{

color:white;
margin-bottom:10px;

}

.box p{

color:white;
margin-bottom:20px;

}

/* Input Fields */

.password{

position:relative;
margin:15px 0;

}

.password input{

width:100%;
padding:12px;
border:none;
border-radius:8px;
outline:none;
font-size:16px;

}

.password span{

position:absolute;
right:15px;
top:12px;
cursor:pointer;
font-size:18px;

}

/* Buttons */

button{

width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
transition:.3s;

}

.save{

background:#0097a7;
color:white;

}

.save:hover{

background:#006064;
transform:scale(1.03);

}

.back{

background:white;
color:#0097a7;

}

.back:hover{

background:#eeeeee;

}

/* Message */

#message{

margin-top:15px;
font-weight:bold;
color:white;

}

/* Animations */

@keyframes fade{

from{

opacity:0;
transform:translateY(-30px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@keyframes float{

0%{

transform:translateY(0);

}

50%{

transform:translateY(-20px);

}

100%{

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="circle circle1"></div>
<div class="circle circle2"></div>
<div class="circle circle3"></div>

<div class="box">

<h2>🔒 Change Password</h2>

<p>Keep your account secure.</p>

<div class="password">

<input type="password" id="current" placeholder="Current Password">

<span onclick="toggleCurrent()">👁️</span>

</div>

<div class="password">

<input type="password" id="newpass" placeholder="New Password">

<span onclick="toggleNew()">👁️</span>

</div>

<div class="password">

<input type="password" id="confirm" placeholder="Confirm Password">

<span onclick="toggleConfirm()">👁️</span>

</div>

<button class="save" onclick="changePassword()">

Save Password

</button>

<button class="back" onclick="goBack()">

Back to Dashboard

</button>

<p id="message"></p>

<script>

// Show / Hide Current Password

function toggleCurrent(){

let x=document.getElementById("current");

if(x.type=="password"){

x.type="text";

}
else{

x.type="password";

}

}

// Show / Hide New Password

function toggleNew(){

let x=document.getElementById("newpass");

if(x.type=="password"){

x.type="text";

}
else{

x.type="password";

}

}

// Show / Hide Confirm Password

function toggleConfirm(){

let x=document.getElementById("confirm");

if(x.type=="password"){

x.type="text";

}
else{

x.type="password";

}

}

// Change Password

function changePassword(){

let current=document.getElementById("current").value;
let newpass=document.getElementById("newpass").value;
let confirm=document.getElementById("confirm").value;
let message=document.getElementById("message");

if(current=="" || newpass=="" || confirm==""){

message.style.color="yellow";
message.innerHTML="⚠ Please fill all the fields.";

}

else if(newpass.length<6){

message.style.color="orange";
message.innerHTML="⚠ Password must contain at least 6 characters.";

}

else if(newpass!=confirm){

message.style.color="red";
message.innerHTML="❌ New Password and Confirm Password do not match.";

}

else{

message.style.color="lightgreen";
message.innerHTML="✅ Password changed successfully!";

setTimeout(function(){

window.location.href="patient_dashboard.html";

},1500);

}

}

// Back Button

function goBack(){

window.location.href="patient_dashboard.html";

}

</script>

</div>

</body>
</html>
