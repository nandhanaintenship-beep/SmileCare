<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smile Care Dental Clinic</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background-image:url("jpg.jpg");
    background-size:cover;
    background-position:center;
    height:100vh;
}

.overlay{
    width:100%;
    height:100vh;
    background:rgba(0,0,0,0.5);
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
}

.logo{
    color:white;
    font-size:30px;
    font-weight:bold;
}

nav ul{
    list-style:none;
    display:flex;
}

nav ul li{
    margin-left:20px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    padding:8px 15px;
    border-radius:5px;
    transition:0.3s;
}

nav ul li a:hover{
    background:#00bcd4;
}

.home{
    margin-left:80px;
    margin-top:150px;
    color:white;
    animation:fade 2s;
}

.home h1{
    font-size:55px;
    margin-bottom:20px;
}

.btn{
    display:inline-block;
    background:#00bcd4;
    color:white;
    text-decoration:none;
    padding:12px 25px;
    border-radius:30px;
    transition:0.3s;
}

.btn:hover{
    background:#008c9e;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateX(-40px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }
}

</style>

</head>

<body>

<div class="overlay">

<nav>

<div class="logo">
Smile Care
</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="doctor.html">Doctors</a></li>
<li><a href="contact.html">Contact</a></li>
<li><a href="login.html">Login</a></li>
<li><a href="register.html">Register</a></li>
<li><a href="appointment.html">Appointment</a></li>
</ul>

</nav>

<div class="home">

<h1>Smile Care Dental Clinic</h1>

<a href="appointment.html" class="btn">Book Appointment</a>

</div>

</div>

<script>

let button=document.querySelector(".btn");

button.addEventListener("mouseover",function(){
    button.innerHTML="Book Now";
});

button.addEventListener("mouseout",function(){
    button.innerHTML="Book Appointment";
});

</script>

</body>
</html>
