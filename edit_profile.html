<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile | Smile Care</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(to right,#e0f7fa,#f1fbfd);
}

/* Header */

header{
background:linear-gradient(to right,#0097a7,#00bcd4);
color:white;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

/* Form Box */

.container{
width:450px;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
animation:fade 1s;
}

.container h2{
text-align:center;
color:#0097a7;
margin-bottom:20px;
}

.profile-image{
text-align:center;
margin-bottom:20px;
}

.profile-image img{
width:120px;
height:120px;
border-radius:50%;
border:4px solid #00acc1;
}

input,select{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
outline:none;

}

input:focus,
select:focus{

border:2px solid #00acc1;

}

.button-group{
display:flex;
justify-content:space-between;
margin-top:20px;
}

button{

padding:12px 25px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
transition:.3s;

}

.save{

background:#0097a7;
color:white;

}

.save:hover{

background:#006064;

}

.back{

background:#757575;
color:white;

}

.back:hover{

background:#424242;

}

#message{

text-align:center;
margin-top:15px;
font-weight:bold;
color:green;

}

/* Footer */

footer{

margin-top:40px;
background:#0097a7;
color:white;
text-align:center;
padding:15px;

}

/* Animation */

@keyframes fade{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>

<body>

<header>

🏥 Smile Care Dental Clinic

</header>

<div class="container">

<h2>Edit Profile</h2>

<div class="profile-image">

<img src="png pro 1.png" alt="Patient">

</div>

<input type="text" id="name" value="Anu">

<input type="number" id="age" value="20">

<select id="gender">

<option>Female</option>
<option>Male</option>
<option>Other</option>

</select>

<input type="text" id="phone" value="9876543210">

<input type="email" id="email" value="anu@gmail.com">

<div class="button-group">

<button class="save" onclick="saveProfile()">Save Changes</button>

<button class="back" onclick="goBack()">Back</button>

</div>

<p id="message"></p>

</div>

<footer>

© 2026 Smile Care Dental Clinic

</footer>

<script>

function saveProfile(){

document.getElementById("message").innerHTML="✅ Profile Updated Successfully!";

}

function goBack(){

window.location.href="patient_dashboard.html";

}

</script>

</body>
</html>
